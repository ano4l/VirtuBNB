<!doctype html>
<html lang="en-ZA">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#176B45" />
    <title>VirtuHost is offline</title>
    <style>
      :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f7f8f7; color: #17201c; }
      body { min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { max-width: 360px; text-align: center; }
      .mark { width: 56px; height: 56px; margin: 0 auto 20px; display: grid; place-items: center; border-radius: 18px; color: white; background: #176b45; font-weight: 800; font-size: 24px; }
      h1 { margin: 0; font-size: 28px; letter-spacing: -0.04em; }
      p { margin: 12px 0 0; color: #5c6963; line-height: 1.6; }
      button { margin-top: 24px; min-height: 48px; padding: 0 20px; border: 0; border-radius: 14px; color: #fff; background: #17201c; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">V</div>
      <h1>You’re offline</h1>
      <p>VirtuHost will reconnect when your device is online again. Your local preview data is safe.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
